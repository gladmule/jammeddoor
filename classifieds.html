<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JAMMED DOOR</title>

  <style>
    .newspaper {
      border: 8px double black;
      padding: 25px;
      margin: 20px 0;
    }

    .box {
      border: 1px solid black;
      padding: 10px;
      margin-bottom: 15px;
      display: inline-block;
    }
  </style>

</head>
<body>

  <h2>JAMMED DOOR</h2>
  <p><b>Experi(mental) music listening society.</b></p>

<hr>
  <div class="newspaper">
<center>
    <h1>✯CLASSIFIEDS✯</h1>

    <p>
      <strong>
        LOOKING FOR SOMETHING? MUSIC? PEOPLE? PROJECTS? IDEAS? A SONG? PLACES? EVENTS? BANDS? PHOTOGRAPHERS? PROMOTERS? SOMETHING ELSE?
      </strong>
    </p>

    <div class="box">
      <strong>GET IN TOUCH --&gt;</strong><br>
      <a href="mailto:thejammeddoor@gmail.com">thejammeddoor@gmail.com</a>
    </div>
</center>
    <hr>

    <p>
      <label for="classified-search">Search classifieds:</label>
      <input
        type="search"
        id="classified-search"
        placeholder="in lowercase"
      >
    </p>

    <div id="classified-list"></div>

    <p id="no-results" style="display: none;">
      NOT YET!
    </p>

    <hr>

    <p><a href="index.html">Back</a></p>

  </div>

<script>
  const searchBox = document.getElementById("classified-search");
  const listings = document.querySelectorAll(".classified");
  const noResults = document.getElementById("no-results");

  searchBox.addEventListener("input", function () {
    const query = searchBox.value.toLowerCase().trim();
    let visibleCount = 0;

    listings.forEach(function (listing) {
      const text = listing.textContent.toLowerCase();

      if (text.includes(query)) {
        listing.style.display = "";
        visibleCount++;
      } else {
        listing.style.display = "none";
      }
    });

    if (visibleCount === 0) {
      noResults.style.display = "";
    } else {
      noResults.style.display = "none";
    }
  });
</script>

</body>
</html>
